<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login" hidden></div>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="side-brand">
      <div class="side-brand-top">
        <span class="side-logo-icon">⚡</span>
        <b id="bizName">CRM</b>
      </div>
      <small>CCTV · Automation · IT · Service · Solar</small>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a href="#" onclick="App.logout();return false"><span>⎋</span> Log out</a>
      <span style="color:#64748b;font-size:11px;font-weight:600">PRO CRM</span>
    </div>
  </aside>
  <div id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon-btn" onclick="document.body.classList.toggle('nav-open')" aria-label="Menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div id="topSearch" class="top-search" onclick="App.openSearch()" title="Global Search (Ctrl+K)">
        <span class="ic">🔍</span>
        <span class="txt">Search leads, customers, jobs, invoices...</span>
        <kbd>Ctrl+K</kbd>
      </div>
      <div class="topbar-actions">
        <div class="quick-create-wrap">
          <button class="btn primary sm" onclick="App.toggleCreateMenu(event)" id="createBtn">+ Create ▾</button>
          <div id="createDropdown" class="dropdown-menu" hidden></div>
        </div>
        <div class="notif-wrap">
          <button id="notifBtn" class="icon-btn notif-btn" onclick="App.toggleNotifMenu(event)" title="Action Center" aria-label="Notifications">
            🔔<span id="notifBadge" class="notif-badge" hidden>0</span>
          </button>
          <div id="notifDropdown" class="dropdown-menu notif-menu" hidden></div>
        </div>
      </div>
      <div id="userBox"></div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="cmdRoot"></div>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="print-area"></div>

<script src="js/util.js"></script>
<script src="js/qr.js"></script>
<script src="js/const.js"></script>
<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/pages/leads.js"></script>
<script src="js/pages/jobcards.js"></script>
<script src="js/pages/rma.js"></script>
<script src="js/pages/surveys.js"></script>
<script src="js/pages/pcbuilder.js"></script>
<script src="js/pages/quotes.js"></script>
<script src="js/pages/inventory.js"></script>
<script src="js/pages/billing.js"></script>
<script src="js/pages/expenses.js"></script>
<script src="js/pages/amc.js"></script>
<script src="js/pages/licenses.js"></script>
<script src="js/pages/customers.js"></script>
<script src="js/pages/field.js"></script>
<script src="js/pages/performance.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
